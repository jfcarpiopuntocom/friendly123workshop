name: Sync3 PR589 verified audit ZIP handoff
on:
  push:
    paths:
      - ".github/workflows/sync3-verified-zip-handoff.yml"
permissions:
  contents: write
jobs:
  import-verified-audit-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build verified exact-SHA review packet from friendly-123 (no live app access)
        shell: bash
        run: |
          set -euo pipefail
          python3 audit-tools/build-sync3-review-zip.py | tee /tmp/sync3-packet-summary.json
          unzip -t -q audit-packets/sync3-pr589-v673/sync3-review-589-sha-ff229fe7.zip
          sha256sum audit-packets/sync3-pr589-v673/sync3-review-589-sha-ff229fe7.zip
          git config user.name "sync3-packet-handoff[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-packets/sync3-pr589-v673/sync3-review-589-sha-ff229fe7.zip
          git diff --cached --quiet && exit 0
          git commit -m "docs(sync3): archive exact SHA ff229fe7 source, diff, evidence and Claude brief"
          git push origin HEAD:main
