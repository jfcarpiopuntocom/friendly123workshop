name: "P0 YParty photos SHA browser bridge (no deploy)"
on:
  push:
    branches: ["feat/20261117-photo-sha-browser"]
  pull_request:
    branches: [main]
    paths:
      - "projects/assembled-v783/app/src/photo-sha-bridge.mjs"
      - "projects/assembled-v783/app/src/ws-owner-ticket-params.mjs"
      - "projects/assembled-v783/app/src/yparty-piloto.js"
      - "projects/assembled-v783/app/docs/sync-yjs.js"
      - "projects/assembled-v783/app/docs/vendor/yparty-piloto.min.js"
      - "projects/assembled-v783/app/test/p0-yparty-photo-sha-browser.test.cjs"
      - ".github/workflows/qa-v783-photo-sha-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test-first browser SHA photo bridge proof
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/p0-yparty-photo-sha-browser.test.cjs 2>&1 | tee /tmp/f123-photo-browser.tap
      - name: Install pinned YParty bundler from existing Workerd lock
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile browser-executed photo bridge and emit exact artifact for commit
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          export NODE_PATH="$(realpath ../relay/injertos/yparty-worker/node_modules)"
          node scripts/build-yparty-piloto.cjs
          node --check docs/vendor/yparty-piloto.min.js
          sha256sum docs/vendor/yparty-piloto.min.js
          node -e 'const fs=require("fs");const x=fs.readFileSync("docs/vendor/yparty-piloto.min.js","utf8");if(x.length<16000)process.exit(4);console.log("F123_PHOTO_BUNDLE_JSON:"+JSON.stringify(x))'

  build-vendor-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/20261117-photo-sha-browser'
    needs: photo-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact vendor from existing locked dependencies
        run: |
          set -euo pipefail
          cd projects/assembled-v783/relay/injertos/yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          cd ../../../app
          export NODE_PATH="$(realpath ../relay/injertos/yparty-worker/node_modules)"
          node scripts/build-yparty-piloto.cjs
          node --check docs/vendor/yparty-piloto.min.js
      - name: Commit browser asset exactly once to the isolated workshop feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assembled-v783/app/docs/vendor/yparty-piloto.min.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(vendor): reproducible SHA photo bridge browser pilot [skip ci]'
            git push origin HEAD:refs/heads/feat/20261117-photo-sha-browser
          fi
