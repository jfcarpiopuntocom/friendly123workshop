name: Compare published v694 RED vs experimental P0 checkpoint provenance
on:
  pull_request:
    paths:
      - 'qa/v694-cross-layer-checkpoint-provenance.test.cjs'
      - '.github/workflows/v694-cross-layer-checkpoint-proof.yml'
permissions:
  contents: read
jobs:
  published-v694-known-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: workshop
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jfcarpiopuntocom/friendly-123
          ref: dbc361a01bc0b97b90ccfe9bd86379c20639cc29
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact published v694 fails in the three known ways (not false GREEN)
        env:
          F123_SOURCE_ROOT: ${{ github.workspace }}/candidate
          F123_EXPECTED_SHA: dbc361a01bc0b97b90ccfe9bd86379c20639cc29
        shell: bash
        run: |
          set +e
          node --test workshop/qa/v694-cross-layer-checkpoint-provenance.test.cjs > "$RUNNER_TEMP/baseline-red.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline-red.txt"
          test "$code" -ne 0
          grep -q '# tests 4' "$RUNNER_TEMP/baseline-red.txt"
          grep -q '# pass 1' "$RUNNER_TEMP/baseline-red.txt"
          grep -q '# fail 3' "$RUNNER_TEMP/baseline-red.txt"
          grep -q 'not ok 1 - P0 cross-provider ACK' "$RUNNER_TEMP/baseline-red.txt"
          grep -q 'not ok 2 - P0 inherited unscoped' "$RUNNER_TEMP/baseline-red.txt"
          grep -q 'not ok 4 - P0 relay selector' "$RUNNER_TEMP/baseline-red.txt"
          echo 'BASELINE v694: verified EXPECTED RED 3/4. NOT production green.' >> "$GITHUB_STEP_SUMMARY"
  experimental-634-expected-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: workshop
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jfcarpiopuntocom/friendly-123
          ref: 04dbe63ce8b7b2f875a8b43e89e6a164e95e6ca9
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-SHA experimental source must satisfy the same four assertions
        env:
          F123_SOURCE_ROOT: ${{ github.workspace }}/candidate
          F123_EXPECTED_SHA: 04dbe63ce8b7b2f875a8b43e89e6a164e95e6ca9
        run: |
          set -euo pipefail
          node --test workshop/qa/v694-cross-layer-checkpoint-provenance.test.cjs
          echo 'EXPERIMENTAL #634: local VM regression GREEN only. NOT Firebase remote, device, or stable release acceptance.' >> "$GITHUB_STEP_SUMMARY"
