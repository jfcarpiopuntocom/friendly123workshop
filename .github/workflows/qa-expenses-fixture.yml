name: QA v783 isolated expenses fixture, source helper (no business writes)
on:
  push:
    branches: [sol/assembled-v783-expenses-fixture-20261116]
    paths: [.github/workflows/qa-expenses-fixture.yml]
permissions:
  contents: read
jobs:
  verify-expenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure only one TEST source differs from frozen base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c705cb8740999903888b04757ee07d428ef61e94
          git diff --name-only FETCH_HEAD HEAD -- projects/assembled-v783/app |
            grep -Fx 'projects/assembled-v783/app/test/dashboard-monthly-expenses.test.js'
          test "$(git diff --name-only FETCH_HEAD HEAD -- projects/assembled-v783/app | wc -l)" -eq 1
          git diff --check FETCH_HEAD HEAD -- projects/assembled-v783/app/test/dashboard-monthly-expenses.test.js
      - name: Test actual expense totals, pending unknown dates, PDF (3 cases)
        working-directory: projects/assembled-v783/app
        run: |
          node --check test/dashboard-monthly-expenses.test.js
          node --test --test-concurrency=1 test/dashboard-monthly-expenses.test.js
