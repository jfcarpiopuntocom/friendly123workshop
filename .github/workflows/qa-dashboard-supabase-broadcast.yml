name: P0 Dashboard Supabase ephemeral broadcast QA
on:
  pull_request:
    paths:
      - projects/assembled-v783/tests/p0-dashboard-supabase-broadcast.cjs
      - .github/workflows/qa-dashboard-supabase-broadcast.yml
permissions:
  contents: read
jobs:
  live-ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Live two-client broadcast, random isolated topic, zero database writes
        run: node projects/assembled-v783/tests/p0-dashboard-supabase-broadcast.cjs
