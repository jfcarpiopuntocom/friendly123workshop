name: Sol QA · install pinned fake-indexeddb TEST dependency only (no product code)
on:
  push:
    branches: [sol/assembled-v783-fake-idb-dev-fixture-20261116]
    paths:
      - ".github/workflows/qa-fake-indexeddb-fixture.yml"
permissions:
  contents: write
jobs:
  idb-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/assembled-v783-fake-idb-dev-fixture-20261116
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source SHA, no production edits or package changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jfcarpiopuntocom/friendly123workshop"
          git merge-base --is-ancestor 96d444df0599c48e10ffc88813eee452a898baf8 HEAD
          test -z "$(git status --porcelain)"
          git diff --quiet 96d444df0599c48e10ffc88813eee452a898baf8 HEAD -- projects/assembled-v783/app/
          test -s projects/assembled-v783/app/package-lock.json
      - name: Prove RED precondition - three tests cannot import fake-indexeddb
        working-directory: projects/assembled-v783/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          node --test --test-concurrency=1 test/p0-s4-outbox-per-op.test.cjs test/p0-v766-diario-yjs-poda.test.cjs > /tmp/idb-red.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "Expected RED missing package, not present"; exit 1; }
          grep -F "Cannot find module 'fake-indexeddb'" /tmp/idb-red.txt >/dev/null
          grep -F "test/p0-s4-outbox-per-op.test.cjs" /tmp/idb-red.txt >/dev/null
          grep -F "test/p0-v766-diario-yjs-poda.test.cjs" /tmp/idb-red.txt >/dev/null
          echo "RED is package missing, not an app failure"
      - name: Install exact mature upstream package as DEV ONLY (frozen lockfile)
        shell: bash
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact fake-indexeddb@6.2.8 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0 fake-indexeddb
          node - <<'NODE'
          const p=require('./package.json'),lock=require('./package-lock.json');
          if(p.dependencies?.['fake-indexeddb'])throw Error('runtime dependency prohibited');
          if(p.devDependencies?.['fake-indexeddb']!=='6.2.8')throw Error('not exact 6.2.8');
          if(lock.packages?.['node_modules/fake-indexeddb']?.version!=='6.2.8')throw Error('lockfile not pinned');
          NODE
      - name: Verify GREEN of native IDB and outbox migrations with real source
        shell: bash
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/p0-s4-outbox-per-op.test.cjs test/p0-v766-diario-yjs-poda.test.cjs
      - name: Verify only lock/package changed, commit to branch without deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' "projects/assembled-v783/app/package-lock.json" "projects/assembled-v783/app/package.json" | sort)"
          test "$CHANGED" = "$EXPECTED" || { echo "Unexpected changed files"; printf '%s\n' "$CHANGED"; exit 1; }
          git add projects/assembled-v783/app/package-lock.json projects/assembled-v783/app/package.json
          git diff --cached --check
          git config user.name "friendly123workshop QA dependencies"
          git config user.email "f123-qa@users.noreply.github.com"
          git commit -m "test(assembled-v783): pin fake-indexeddb 6.2.8 as dev-only IDB fixture"
          gh auth setup-git
          git remote set-url origin "https://github.com/jfcarpiopuntocom/friendly123workshop.git"
          git push origin HEAD:refs/heads/sol/assembled-v783-fake-idb-dev-fixture-20261116
