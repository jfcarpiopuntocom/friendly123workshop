name: v783 coldjoin safe exception stage (synthetic-only, no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/assembled-v783/app/scripts/canario-union-fria.cjs'
      - 'projects/assembled-v783/app/test/p0-coldjoin-exception-phase.test.cjs'
      - '.github/workflows/qa-v783-coldjoin-exception-phase.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The historical workflow-secrets test needs app/.github/workflows/hotfix.yml,\n      # absent from the assembled subset; it remains untouched and separately NO-GO.\n      - name: RED/GREEN on actual canary script, no remote network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/assembled-v783/evidence/coldjoin-phase-ci
          git rev-parse HEAD | tee projects/assembled-v783/evidence/coldjoin-phase-ci/sha.txt
          node --check projects/assembled-v783/app/scripts/canario-union-fria.cjs
          node --test --test-concurrency=1 \
            projects/assembled-v783/app/test/p0-coldjoin-exception-phase.test.cjs \
            projects/assembled-v783/app/test/canario-union-fria-guard.test.cjs 2>&1 | tee projects/assembled-v783/evidence/coldjoin-phase-ci/tap.log
      - name: Preserve TAP and HEAD on both RED and GREEN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v783-coldjoin-safe-stage-${{ github.run_id }}
          path: projects/assembled-v783/evidence/coldjoin-phase-ci/
          retention-days: 14
          if-no-files-found: warn
