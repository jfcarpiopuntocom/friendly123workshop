name: Assembled v783 browser and authority QA (no deploy)
on:
  push:
    branches: [main]
    paths:
      - projects/assembled-v783/**
      - .github/workflows/assembled-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assembled-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/assembled-v783/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked packages and official Chromium/WebKit system dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Authority, local Team and imported component contracts
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=45000 \
            test/p0-team-authority.test.mjs test/p0-team-worker-api.test.mjs test/p0-team-authority-client.test.cjs test/p0-team-authority-local-commit.test.cjs \
            test/p0-ws-authorized-subject.test.mjs test/p0-central-pin-authority.test.mjs test/p0-central-pin-worker-entry.test.mjs \
            test/p0-money-imported.test.cjs test/p0-workbox-registration-path.test.cjs test/team-access-hardening.test.js \
            test/p0-ws-capability-issuer.test.mjs test/p0-ws-worker-api.test.mjs
      - name: Sol6 commercial browser cases on this exact candidate
        env:
          F123_QA_CLIENT_ROOT: ${{ github.workspace }}/projects/assembled-v783/app
          F123_QA_IMPORTED_MONEY: '1'
        run: node --test --test-concurrency=1 --test-timeout=180000 ../qa/browser/browser-first-commercial.test.cjs
      - name: Same-profile double-tab sales
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=180000 test/linus-dos-pestanas.test.js
      - name: Durable cancellation, credit and stock witnesses
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 \
            test/p0-cancelacion-tardia-durable.test.cjs test/fiado-durable-venta-v519.test.js test/stock-journal-yjs.test.cjs
      - name: Cents, settlements and commission reports
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 \
            test/dinero-centavos.test.js test/dinero-paso-dolar.test.js test/medio-pago-comision.test.js test/comision-por-producto.test.js \
            test/p0-v778-comisiones-sin-recorrer.test.cjs test/p0-v779-resumen-pausa-venta.test.cjs test/p0-v780-comisiones-pinta-ultima.test.cjs
      - name: Photo bytes, hash, fallback and backup
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 \
            test/p0-photo-hash-ack-variant.test.cjs test/photo-hash-durable-4d.test.cjs test/p0-h3-photo-legacy-fallback.test.cjs \
            test/yjs-photo-seed-stable.test.js test/backup-fotos.test.js test/p0-v746-photo-independent-budget.test.cjs
      - name: Roles and local durable recovery
        run: |
          node ../qa/browser/adjust-legacy-static-assertion.cjs test/p0-sales-atomic-idb-webkit-browser.test.cjs
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 \
            test/advanced-device-roles.test.cjs test/linus-roles-matriz.test.js test/p0-idb-closed-handle-reopen-sale.test.cjs \
            test/p0-sales-atomic-idb-webkit-browser.test.cjs test/p0-missing-pin-state.test.cjs test/incident-idb-payout-name-photo-race-4d-v2.test.cjs
      - name: Imported YServer, real issuer and SQL cold recovery
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=45000 qa/p0-real-session-room.test.mjs
