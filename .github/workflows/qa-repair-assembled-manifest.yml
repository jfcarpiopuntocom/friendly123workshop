name: Sol QA · Repair exact assembled v783 shell-manifest hashes (NO SW / NO DEPLOY)
on:
  push:
    branches: [sol/assembled-v783-manifest-integrity-20261116]
    paths:
      - ".github/workflows/qa-repair-assembled-manifest.yml"
permissions:
  contents: write
jobs:
  manifest-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/assembled-v783-manifest-integrity-20261116
          fetch-depth: 0
          persist-credentials: false
      - name: Protect Codex source and provenance, reject unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jfcarpiopuntocom/friendly123workshop"
          test "$(git branch --show-current)" = "sol/assembled-v783-manifest-integrity-20261116"
          git merge-base --is-ancestor ceb0be84f079a97acf6106f9599d803e7de029cc HEAD
          git diff --quiet ceb0be84f079a97acf6106f9599d803e7de029cc HEAD -- projects/assembled-v783/app/
          test -z "$(git status --porcelain)"
          test -s projects/assembled-v783/app/docs/version-manifest.json
      - name: Prove RED precondition is the stale manifest, not missing binaries
        working-directory: projects/assembled-v783/app
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test --test-concurrency=1 --test-name-pattern="current release shell and exact edited assets|v637 manifest matches" test/dashboard-customer-editor-and-pdf-v518.test.js test/p0-v637-manifest.test.cjs > /tmp/manifest-before.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "Expected stale manifest RED before regeneration"; exit 1; }
          grep -F "not ok" /tmp/manifest-before.txt
          grep -F "mock-backend.js" /tmp/manifest-before.txt >/dev/null
          grep -F "vendor/money-imported.min.js" /tmp/manifest-before.txt >/dev/null
          echo "Verified stale manifest mismatches in mock-backend and imported-money bundle"
      - name: Rebuild deterministic shell manifest via existing upstream generator
        shell: bash
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node scripts/gen-manifest.js
          # No SW/PWA, app code, vendor bundles, scripts, business data, lockfile changed.
          CHANGED="$(git diff --name-only)"
          EXPECTED="projects/assembled-v783/app/docs/version-manifest.json"
          test "$CHANGED" = "$EXPECTED" || { printf 'Unexpected touched files:\n%s\n' "$CHANGED"; exit 1; }
          git diff --check -- docs/version-manifest.json
      - name: GREEN exact integrity tests after rebuilding
        shell: bash
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-name-pattern="current release shell and exact edited assets|v637 manifest matches" test/dashboard-customer-editor-and-pdf-v518.test.js test/p0-v637-manifest.test.cjs
          node --check scripts/gen-manifest.js
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('docs/version.json')); const m=JSON.parse(fs.readFileSync('docs/version-manifest.json')); if(m.shell!==v.shell) process.exit(1); console.log('SHELL_OK',v.shell,Object.keys(m.files).length)"
      - name: Commit manifest ONLY to isolated Sol branch (not main, prod or pages)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "sol/assembled-v783-manifest-integrity-20261116"
          git add -- projects/assembled-v783/app/docs/version-manifest.json
          test "$(git diff --cached --name-only)" = "projects/assembled-v783/app/docs/version-manifest.json"
          git config user.name "friendly123workshop manifest QA"
          git config user.email "f123-qa@users.noreply.github.com"
          git commit -m "fix(assembled-v783): reseal shell hash manifest after Dinero default integration"
          gh auth setup-git
          git remote set-url origin "https://github.com/jfcarpiopuntocom/friendly123workshop.git"
          git push origin HEAD:refs/heads/sol/assembled-v783-manifest-integrity-20261116
          echo "Resealed candidate only, production unchanged"
