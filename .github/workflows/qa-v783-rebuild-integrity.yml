name: QA v783 restore integrity manifest from exact assembled application bytes (NO DEPLOY)
on:
  push:
    branches: [sol/assembled-v783-integrity-audit-20261116]
    paths: [.github/workflows/qa-v783-rebuild-integrity.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/assembled-v783-integrity-audit-20261116
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure exact user-approved branch and current source proof
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jfcarpiopuntocom/friendly123workshop"
          test "$(git branch --show-current)" = "sol/assembled-v783-integrity-audit-20261116"
          test -s projects/assembled-v783/app/docs/version-manifest.json
          test -s projects/assembled-v783/app/docs/mock-backend.js
          test -s projects/assembled-v783/app/docs/vendor/money-imported.min.js
          test -s projects/assembled-v783/app/lab/stock-journal/forensic-reconciliation.cjs
          test -s projects/assembled-v783/app/lab/stock-journal/legacy-preflight.cjs
      - name: Generate official deterministic manifest without modifying service worker
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node scripts/gen-manifest.js
          node --test test/p0-v637-manifest.test.cjs test/dashboard-customer-editor-and-pdf-v518.test.js
      - name: Fail closed on any modification outside the single manifest
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/f123-diff-files.txt
          test "$(wc -l </tmp/f123-diff-files.txt)" -eq 1
          test "$(cat /tmp/f123-diff-files.txt)" = "projects/assembled-v783/app/docs/version-manifest.json"
          git diff --check -- projects/assembled-v783/app/docs/version-manifest.json
          git status --porcelain
      - name: Commit only the integrity manifest on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "friendly-123 QA manifest sync"
          git config user.email "f123-qa@users.noreply.github.com"
          git add -- projects/assembled-v783/app/docs/version-manifest.json
          git commit -m "fix(v783): regenerate exact shell SHA256 after imported money and sale changes"
          gh auth setup-git
          git remote set-url origin https://github.com/jfcarpiopuntocom/friendly123workshop.git
          git push origin HEAD:refs/heads/sol/assembled-v783-integrity-audit-20261116
          echo "No production or Pages deployments triggered by this QA branch"
