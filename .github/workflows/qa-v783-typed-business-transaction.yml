name: P0 typed business atomic application in real Workerd SQLite (no deploy)
on:
  pull_request:
    paths:
      - projects/assembled-v783/relay/injertos/yparty-worker/src/typed-commercial-ledger.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-typed-business-transaction-workerd.test.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/fixtures/typed-business-worker.mjs
      - .github/workflows/qa-v783-typed-business-transaction.yml
  push:
    branches: [feat/20261117-p0-closure-single-owner-checkpoint]
    paths:
      - projects/assembled-v783/relay/injertos/yparty-worker/src/typed-commercial-ledger.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-typed-business-transaction-workerd.test.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/fixtures/typed-business-worker.mjs
      - .github/workflows/qa-v783-typed-business-transaction.yml
permissions:
  contents: read
jobs:
  real-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked existing Workerd dependencies
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TDD exact original Workerd ledger plus atomic application and cold restart
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: |
          node --check src/typed-commercial-ledger.mjs
          node --test --test-concurrency=1 qa/p0-typed-commercial-ledger-workerd.test.mjs qa/p0-typed-business-transaction-workerd.test.mjs
