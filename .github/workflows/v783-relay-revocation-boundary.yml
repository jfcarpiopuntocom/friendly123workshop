name: v783 relay revocation causal boundary (local Workerd only)
on:
  pull_request:
    paths:
      - 'projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-real-session-room.test.mjs'
      - '.github/workflows/v783-relay-revocation-boundary.yml'
permissions:
  contents: read
jobs:
  strict-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/assembled-v783/app/package-lock.json
            projects/assembled-v783/relay/injertos/yparty-worker/package-lock.json
      - name: Install existing app and relay lockfiles and browser runtimes
        shell: bash
        run: |
          set -euo pipefail
          cd projects/assembled-v783/app
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
          cd ../relay/injertos/yparty-worker
          npm ci --ignore-scripts
      - name: Three full strict authorization suites, no assertion relaxation
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../evidence/relay-revocation
          git rev-parse HEAD | tee ../../../evidence/relay-revocation/sha.txt
          for i in 1 2 3; do
            echo "::group::Full Workerd authorization suite $i"
            node --test --test-concurrency=1 --test-timeout=45000 qa/p0-authorized-provider.test.mjs qa/p0-real-session-room.test.mjs 2>&1 | tee "../../../evidence/relay-revocation/round-$i.log"
            echo "::endgroup::"
          done
      - name: Archive causal evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v783-relay-revocation-${{ github.run_id }}
          path: projects/assembled-v783/evidence/relay-revocation/
          if-no-files-found: warn
          retention-days: 14
