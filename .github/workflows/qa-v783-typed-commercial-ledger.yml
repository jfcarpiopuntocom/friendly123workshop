name: QA · typed commercial inbox durable opId (no deploy)
on:
  push:
    branches: [sol/v783-typed-commercial-ops-ledger-20261116]
    paths:
      - projects/assembled-v783/relay/injertos/yparty-worker/src/typed-commercial-ledger.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-typed-commercial-ledger.test.mjs
      - .github/workflows/qa-v783-typed-commercial-ledger.yml
  pull_request:
    paths:
      - projects/assembled-v783/relay/injertos/yparty-worker/src/typed-commercial-ledger.mjs
      - projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-typed-commercial-ledger.test.mjs
      - .github/workflows/qa-v783-typed-commercial-ledger.yml
permissions:
  contents: read
jobs:
  synthetic-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax then 15 security/idempotence tests
        run: |
          node --check projects/assembled-v783/relay/injertos/yparty-worker/src/typed-commercial-ledger.mjs
          node --test projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-typed-commercial-ledger.test.mjs
