name: "P0 Opus Team real Workerd catalog read-only and revocation (no deploy)"
on:
  push:
    branches: ["feat/20261117-team-cat-readonly-real-authority"]
  pull_request:
    branches: [main]
    paths:
      - "projects/assembled-v783/relay/injertos/yparty-worker/src/ws-authority-client.js"
      - "projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-secure-separate-rooms.test.mjs"
      - ".github/workflows/qa-v783-team-readonly-cat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  team-cat:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned real Workerd stack
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Actual secure Workerd rooms, central Team tickets, read-only and revocation RED GREEN'
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 qa/p0-secure-separate-rooms.test.mjs 2>&1 | tee /tmp/f123-team-cat-real.tap
