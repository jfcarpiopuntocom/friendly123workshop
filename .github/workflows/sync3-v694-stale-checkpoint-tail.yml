name: Sync3 v698 cross-writer pre-CKPT completeness RED-to-GREEN (synthetic)
on:
  pull_request:
    paths:
      - 'qa/sync3-v694-stale-checkpoint-tail.test.cjs'
      - '.github/workflows/sync3-v694-stale-checkpoint-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stale-checkpoint-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          path: workshop
          persist-credentials: false
      - name: Checkout immutable v698 experimental source (read-only)
        uses: actions/checkout@v4
        with:
          repository: jfcarpiopuntocom/friendly-123
          ref: 0d2203a30ed2d42dea3c5caead97da00631125b6
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact source and run stale-checkpoint, negative-control and pagination test
        env:
          F123_SOURCE_ROOT: ${{ github.workspace }}/candidate
          F123_EXPECTED_SHA: 0d2203a30ed2d42dea3c5caead97da00631125b6
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "0d2203a30ed2d42dea3c5caead97da00631125b6"
          echo 'LAB ONLY: no production Firebase/Supabase, no license, PIN, customer or shop data'
          node --test workshop/qa/sync3-v694-stale-checkpoint-tail.test.cjs
