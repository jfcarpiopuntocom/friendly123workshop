name: Sync3 v696 genesis ancestor auto-repair RED-first (synthetic)
on:
  pull_request:
    paths:
      - 'qa/sync3-v694-stale-checkpoint-tail.test.cjs'
      - '.github/workflows/sync3-v694-stale-checkpoint-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stale-checkpoint-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          path: workshop
          persist-credentials: false
      - name: Checkout immutable published production source (read-only)
        uses: actions/checkout@v4
        with:
          repository: jfcarpiopuntocom/friendly-123
          ref: 901ad6aa8dbf0b926815e8281f3b80fe7894ffd5
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact source and run stale-checkpoint, negative-control and pagination test
        env:
          F123_SOURCE_ROOT: ${{ github.workspace }}/candidate
          F123_EXPECTED_SHA: 901ad6aa8dbf0b926815e8281f3b80fe7894ffd5
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "901ad6aa8dbf0b926815e8281f3b80fe7894ffd5"
          echo 'LAB ONLY: no production Firebase/Supabase, no license, PIN, customer or shop data'
          node --test workshop/qa/sync3-v694-stale-checkpoint-tail.test.cjs
