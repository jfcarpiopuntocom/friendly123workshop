name: Verify pinned fake-indexeddb minimal lockfile (no product writes)
on:
  push:
    branches: [sol/assembled-v783-fake-idb-dev-fixture-20261116]
    paths: [.github/workflows/qa-verify-minimal-idb-lock.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/assembled-v783/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without scripts or audit network calls
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove exact dev dependency and pristine optional platform metadata
        run: |
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          const assert=require('node:assert/strict');
          assert.equal(p.devDependencies['fake-indexeddb'],'6.2.8');
          assert.equal(p.dependencies?.['fake-indexeddb'],undefined);
          assert.equal(l.packages['node_modules/fake-indexeddb'].version,'6.2.8');
          assert.equal(l.packages['node_modules/fake-indexeddb'].dev,true);
          // The lockfile was structurally diffed byte-for-byte against the frozen
          // baseline before this run; here we verify that npm ci really installs it.
          const found=require('fake-indexeddb');
          assert.equal(typeof found.indexedDB.open,'function');
          NODE
          npm ls fake-indexeddb --depth=0
          test -z "$(git status --porcelain)"
      - name: IndexedDB S4 migration + Yjs outbox cleanup tests, no production network
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 test/p0-s4-outbox-per-op.test.cjs test/p0-v766-diario-yjs-poda.test.cjs
