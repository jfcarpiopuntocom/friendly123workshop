name: "P0 Gate D · real Tienda opens existing store history and goes forward, with failback — Workerd (no deploy)"
on:
  push:
    branches: ["claude/gate-d-abrir-existente"]
  pull_request:
    branches: [main]
    paths:
      - "projects/assembled-v783/relay/injertos/yparty-worker/src/open-existing-store.mjs"
      - "projects/assembled-v783/relay/injertos/yparty-worker/src/certified-frozen-import.mjs"
      - "projects/assembled-v783/relay/injertos/yparty-worker/src/durable-full-yjs-export.mjs"
      - "projects/assembled-v783/relay/injertos/yparty-worker/src/index.js"
      - "projects/assembled-v783/relay/injertos/yparty-worker/qa/fixtures/gate-d-open-existing-worker.mjs"
      - "projects/assembled-v783/relay/injertos/yparty-worker/qa/p0-gate-d-open-existing-workerd.test.mjs"
      - ".github/workflows/qa-v783-gate-d-open-existing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-d-open-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Workerd/Yjs and app issuer dependencies
        run: |
          cd projects/assembled-v783/app
          npm ci --ignore-scripts --no-audit --no-fund
          cd ../relay/injertos/yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Open existing synthetic history as-is, forward, cold join, failback; frozen import and full export regressions'
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test --test-concurrency=1 qa/p0-gate-d-open-existing-workerd.test.mjs qa/p0-frozen-import-workerd.test.mjs qa/p0-full-export-workerd.test.mjs qa/p0-certified-frozen-import.test.mjs 2>&1 | tee /tmp/f123-gate-d.tap
