name: "P0 YParty client live Owner tickets cat/ops (no deploy)"
on:
  push:
    branches: ["feat/20261117-yparty-client-rooms"]
  pull_request:
    branches: [main]
    paths:
      - "projects/assembled-v783/app/src/yparty-piloto.js"
      - "projects/assembled-v783/app/src/ws-owner-ticket-params.mjs"
      - "projects/assembled-v783/app/test/p0-yparty-client-real-tickets.test.cjs"
      - ".github/workflows/qa-v783-client-rooms.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Verify real client uses trusted fresh Owner ticket scopes; no bare credentials'
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/p0-yparty-client-real-tickets.test.cjs test/p0-yparty-client-built-bundle.test.cjs 2>&1 | tee /tmp/f123-client-live-tickets.tap
      - name: Install locked Worker build packages (no lifecycle hooks)
        working-directory: projects/assembled-v783/relay/injertos/yparty-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build real browser-loadable vendor YParty pilot from exact source
        working-directory: projects/assembled-v783/app
        run: |
          set -euo pipefail
          export NODE_PATH="$(realpath ../relay/injertos/yparty-worker/node_modules)"
          node scripts/build-yparty-piloto.cjs
          node --check docs/vendor/yparty-piloto.min.js
          sha256sum docs/vendor/yparty-piloto.min.js
          git diff --exit-code -- docs/vendor/yparty-piloto.min.js
          node -e 'const fs=require("fs");const x=fs.readFileSync("docs/vendor/yparty-piloto.min.js","utf8");if(x.length<5000)process.exit(4);console.log("F123_BUNDLE_JSON:"+JSON.stringify(x))'
